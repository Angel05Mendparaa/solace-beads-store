<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle for favicon legibility -->
  <circle cx="50" cy="50" r="50" fill="#FFFDF9"/>

  <!-- Bold serif E -->
  <rect x="22" y="18" width="11" height="64" rx="1" fill="#111111"/>
  <rect x="22" y="18" width="44" height="10" rx="1" fill="#111111"/>
  <rect x="22" y="45" width="36" height="10" rx="1" fill="#111111"/>
  <rect x="22" y="72" width="44" height="10" rx="1" fill="#111111"/>

  <!-- Needle body golden diagonal piercing through E -->
  <line x1="62" y1="78" x2="80" y2="20" stroke="#C9A84C" stroke-width="3.2" stroke-linecap="round"/>
  <ellipse cx="80.5" cy="19" rx="1.5" ry="1.5" fill="#C9A84C"/>
  <ellipse cx="76" cy="28" rx="2.8" ry="1.5" transform="rotate(-60 76 28)" fill="#FFFDF9" stroke="#C9A84C" stroke-width="1"/>

  <!-- Thread rose pink looping through needle eye -->
  <path d="M 72 22 C 68 14, 84 10, 85 18 C 86 26, 74 30, 70 38 C 66 46, 72 52, 68 58"
        fill="none" stroke="#D4849A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
